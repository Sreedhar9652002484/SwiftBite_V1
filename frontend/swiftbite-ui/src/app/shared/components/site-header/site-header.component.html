<header class="site-header">
  <div class="site-header__bar">
    <a routerLink="/home" class="site-header__brand">
      <span class="site-header__logo"><app-brand-mark /></span>
      <span class="site-header__name">SwiftBite</span>
    </a>

    <nav class="site-header__nav site-header__nav--desktop">
      <a routerLink="/home" routerLinkActive="is-active" class="site-header__link">Home</a>
      <a routerLink="/orders" routerLinkActive="is-active" class="site-header__link">Orders</a>
      <a routerLink="/become-partner" routerLinkActive="is-active" class="site-header__link">Become a Partner</a>
    </nav>

    <div class="site-header__actions">
      <app-notification-bell />
      <app-theme-toggle />

      <a routerLink="/profile" class="site-header__avatar" aria-label="Profile">
        <span>{{ auth.firstName ? auth.firstName.charAt(0) : 'U' }}</span>
      </a>

      <button type="button" class="site-header__logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
