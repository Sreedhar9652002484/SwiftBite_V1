<div class="admin-shell">

  <!-- ── Mobile topbar ─────────────────────────────────── -->
  <div class="mobile-topbar">
    <button class="hamburger" (click)="toggleMobileMenu()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-topbar__title">Admin</span>
    <app-theme-toggle />
  </div>

  <div class="sidebar-backdrop" *ngIf="mobileMenuOpen()" (click)="closeMobileMenu()"></div>

  <aside class="sidebar" [class.sidebar--open]="mobileMenuOpen()">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">SwiftBite</span>
      <span class="brand-pill">Admin</span>
      <app-theme-toggle class="brand-theme-toggle" />
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="admin-row">
        <div class="avatar">{{ auth.firstName ? auth.firstName[0] : 'A' }}</div>
        <div>
          <p class="admin-name">{{ auth.firstName || 'Admin' }}</p>
          <p class="admin-role">Platform Admin</p>
        </div>
      </div>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>

</div>
