<div class="delivery-shell">

  <!-- ── Mobile topbar ─────────────────────────────────── -->
  <div class="mobile-topbar">
    <button class="hamburger" (click)="toggleMobileMenu()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-topbar__title">{{ partnerName() }}</span>
    <app-theme-toggle />
  </div>

  @if (mobileMenuOpen()) {
    <div class="sidebar-backdrop" (click)="closeMobileMenu()"></div>
  }

  <aside class="sidebar" [class.sidebar--open]="mobileMenuOpen()">
    <div class="sidebar-brand">
      <span class="brand-icon">🚴</span>
      <span class="brand-name">SwiftBite</span>
      <span class="brand-pill">Delivery</span>
      <app-theme-toggle class="brand-theme-toggle" />
    </div>

    <div class="availability-card">
      <p class="partner-name">{{ partnerName() }}</p>
      <button
        class="availability-toggle"
        [class.online]="isAvailable()"
        [disabled]="togglingStatus()"
        (click)="toggleAvailability()"
      >
        <span class="toggle-dot"></span>
        {{ isAvailable() ? 'Online' : 'Offline' }}
      </button>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="delivery-content">
    <router-outlet></router-outlet>
  </main>

</div>
