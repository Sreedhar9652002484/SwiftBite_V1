<div class="owner-shell">

  <!-- ── Mobile topbar ─────────────────────────────────── -->
  <div class="mobile-topbar">
    <button class="hamburger" (click)="toggleMobileMenu()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-topbar__title">{{ restaurantName() }}</span>
    <app-theme-toggle />
  </div>

  <!-- ── Backdrop (mobile only, when drawer open) ───────── -->
  @if (mobileMenuOpen()) {
    <div class="sidebar-backdrop" (click)="closeMobileMenu()"></div>
  }

  <!-- ── Sidebar ─────────────────────────────────────── -->
  <aside class="sidebar" [class.sidebar--open]="mobileMenuOpen()">

    <div class="sidebar-brand">
      <span class="brand-icon">🍴</span>
      <span class="brand-name">SwiftBite</span>
      <span class="brand-pill">Owner</span>
      <app-theme-toggle class="brand-theme-toggle" />
    </div>

    <!-- Restaurant name + open/closed toggle -->
    <div class="restaurant-card">
      <p class="restaurant-name">{{ restaurantName() }}</p>

      <button
        class="status-toggle"
        [class.open]="isOpen()"
        [disabled]="togglingStatus()"
        (click)="toggleStatus()"
        [attr.aria-label]="isOpen() ? 'Close restaurant' : 'Open restaurant'"
      >
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
        <span class="status-label">{{ isOpen() ? 'Open' : 'Closed' }}</span>
      </button>
    </div>

    <!-- Nav links -->
    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-text">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Footer: user + logout -->
    <div class="sidebar-footer">
      <div class="owner-row">
        <div class="avatar">{{ auth.firstName ? auth.firstName[0] : 'O' }}</div>
        <span class="owner-name">{{ auth.firstName || 'Owner' }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>

  </aside>

  <!-- ── Main content area ────────────────────────────── -->
  <main class="owner-content">
    <router-outlet></router-outlet>
  </main>

</div>
