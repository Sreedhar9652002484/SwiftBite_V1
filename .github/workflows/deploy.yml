name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: authserver
            dockerfile: src/AuthServer/SwiftBite.AuthServer/Dockerfile
            containerapp: swiftbite-authserver
          - service: apigateway
            dockerfile: src/ApiGateway/SwiftBite.ApiGateway/Dockerfile
            containerapp: swiftbite-apigateway
          - service: userservice
            dockerfile: src/Services/SwiftBite.UserService/Dockerfile
            containerapp: swiftbite-userservice
          - service: restaurantservice
            dockerfile: src/Services/SwiftBite.RestaurantService/Dockerfile
            containerapp: swiftbite-restaurantservice
          - service: orderservice
            dockerfile: src/Services/SwiftBite.OrderService/Dockerfile
            containerapp: swiftbite-orderservice
          - service: paymentservice
            dockerfile: src/Services/SwiftBite.PaymentService/Dockerfile
            containerapp: swiftbite-paymentservice
          - service: deliveryservice
            dockerfile: src/Services/SwiftBite.DeliveryService/Dockerfile
            containerapp: swiftbite-deliveryservice
          - service: notificationservice
            dockerfile: src/Services/SwiftBite.NotificationService/Dockerfile
            containerapp: swiftbite-notificationservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/swiftbite-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/swiftbite-${{ matrix.service }}:${{ github.sha }}

      - name: Deploy ${{ matrix.service }} to Azure Container Apps
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App (retries on transient conflicts)
        run: |
          for attempt in 1 2 3 4 5; do
            if az containerapp update \
              --name ${{ matrix.containerapp }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/swiftbite-${{ matrix.service }}:${{ github.sha }}; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1
